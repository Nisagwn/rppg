# Mobil uygulamayı (mobile/) test edip GitHub Pages'e yayınlar.
name: Mobil uygulama

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobil.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sinyal işleme testleri (Python ile eşdeğerlik)
        run: node --test mobile/test/dsp.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Yayın klasörü
        run: |
          mkdir _site
          cp -r mobile/index.html mobile/style.css mobile/app.js mobile/dsp.js mobile/sw.js \
                mobile/manifest.webmanifest mobile/icons mobile/vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
