# Mobil uygulamayı (mobile/) test edip GitHub Pages'e yayınlar.
name: Mobil uygulama

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobil.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sinyal işleme (Python ile eşdeğerlik) ve model girdisi testleri
        run: node --test mobile/test/dsp.test.mjs mobile/test/dl_pack.test.mjs mobile/test/face_decode.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Yayın klasörü
        run: |
          mkdir _site
          cp -r mobile/index.html mobile/style.css mobile/app.js mobile/dsp.js mobile/sw.js \
                mobile/dl_worker.js mobile/dl_pack.js mobile/face_worker.js mobile/face_decode.js mobile/model \
                mobile/manifest.webmanifest mobile/icons mobile/vendor _site/
          # sw.js'in önbellek listesindeki her dosya yayında olmalı (v14'te face_*.js kopyalanmamış, uygulama açılmamıştı)
          for f in $(sed -n '/FILES = \[/,/\];/p' _site/sw.js | grep -o '"[^"]*"' | tr -d '"'); do
            [ "$f" = "./" ] || [ -e "_site/$f" ] || { echo "yayında eksik: $f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
