# Python paketini (rppg/) her değişiklikte test eder.
name: Python testleri

on:
  push:
    branches: [main]
    paths: ["rppg/**", "tests/**", "scripts/**", "requirements.txt", "pytest.ini", ".github/workflows/python.yml"]
  pull_request:
    paths: ["rppg/**", "tests/**", "scripts/**", "requirements.txt", "pytest.ini", ".github/workflows/python.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Kütüphaneler
        run: pip install -r requirements.txt pyflakes
      - name: Statik kontrol
        run: python -m pyflakes rppg scripts tests
      - name: Testler
        run: python -m pytest -q
